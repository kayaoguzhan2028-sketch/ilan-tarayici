name: Ilan taramasi

on:
  schedule:
    - cron: "23 6 * * *"    # İş ilanları: her gün 09:23 (Türkiye saati)
    - cron: "17 7 * * 1"    # Akademik ilanlar: her pazartesi 10:17 (Türkiye saati)
  workflow_dispatch:         # Telefondan "Run workflow" ile elle başlatma
    inputs:
      hangisi:
        description: "Hangi tarama?"
        type: choice
        options: [ikisi, is, akademik]
        default: ikisi

permissions:
  contents: write

concurrency:
  group: tarama
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NTFY_KONU: ${{ secrets.NTFY_KONU }}
      DRIVE_WEBHOOK: ${{ secrets.DRIVE_WEBHOOK }}
      DRIVE_ANAHTAR: ${{ secrets.DRIVE_ANAHTAR }}
      # Zamanlanmış çalıştırmada hangi tarama: günlük cron → iş, pazartesi cron → akademik
      IS: ${{ github.event.schedule == '23 6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.hangisi != 'akademik') }}
      AKADEMIK: ${{ github.event.schedule == '17 7 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.hangisi != 'is') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: |
          pip install playwright pypdf openpyxl
          python -m playwright install --with-deps chromium

      - name: İş ilanı taraması (LinkedIn + kariyer.net + Arkitera)
        if: env.IS == 'true'
        run: python is_ilani_tara.py
        continue-on-error: true

      - name: Akademik ilan taraması (ilan.gov.tr)
        if: env.AKADEMIK == 'true'
        run: python ars_gor_tara.py
        continue-on-error: true

      - name: Sonuçları repoya kaydet
        run: |
          git config user.name "ilan-bot"
          git config user.email "ilan-bot@users.noreply.github.com"
          git add sonuclar
          git commit -m "Tarama $(date +%F)" || echo "Yeni değişiklik yok"
          git pull --rebase origin main || true
          git push
